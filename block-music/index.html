<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA Musical Pro - Detector de Ofensas</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; display: flex; justify-content: center; padding: 30px; }
        .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 900px; position: relative; }
        
        h1 { text-align: center; color: #2c3e50; margin-bottom: 10px; }
        
        /* Botão de Shutdown (Topo Direito) */
        .shutdown-btn {
            position: absolute; top: 20px; right: 20px;
            background: #e74c3c; color: white; border: none; 
            width: 30px; height: 30px; border-radius: 50%; 
            font-weight: bold; cursor: pointer; display: flex; 
            align-items: center; justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .shutdown-btn:hover { background: #c0392b; transform: scale(1.1); }
        .shutdown-btn::after { content: "⏻"; font-size: 16px; }

        /* Layout Grid */
        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        
        .upload-box { 
            border: 2px dashed #bdc3c7; padding: 15px; text-align: center; 
            border-radius: 8px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; flex-direction: column;
            grid-column: 1 / -1; 
            background: #fbfbfb;
        }
        .upload-box:hover { background: #f0f8ff; border-color: #3498db; }
        
        .config-box { background: #ecf0f1; padding: 15px; border-radius: 8px; display: flex; flex-direction: column; gap: 10px; }
        
        input[type="text"], select, button { padding: 10px; border-radius: 5px; border: 1px solid #ccc; width: 100%; box-sizing: border-box; }
        
        .radio-group { display: flex; gap: 15px; margin-top: 5px; }
        .radio-group label { font-weight: normal; font-size: 14px; cursor: pointer; }
        
        .action-buttons { display: flex; gap: 10px; margin-top: 10px; }
        
        #btnProcessar { background: #2980b9; color: white; border: none; font-weight: bold; cursor: pointer; font-size: 16px; flex: 1; }
        #btnProcessar:hover { background: #3498db; }
        #btnProcessar:disabled { background: #95a5a6; cursor: not-allowed; }

        #btnCancelar { background: #e74c3c; color: white; border: none; font-weight: bold; cursor: pointer; font-size: 16px; flex: 1; display: none; }
        #btnCancelar:hover { background: #c0392b; }

        .timer-display { text-align: center; font-size: 24px; font-weight: bold; color: #e67e22; margin: 15px 0; display: none; }
        .resultado-box { display: none; margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; }
        
        .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .metric-card { background: #e8f6f3; padding: 10px; border-radius: 6px; text-align: center; border: 1px solid #d1f2eb; }
        .metric-value { display: block; font-size: 18px; font-weight: bold; color: #16a085; }
        .metric-label { font-size: 11px; color: #7f8c8d; text-transform: uppercase; }

        .veredito-card { padding: 15px; text-align: center; border-radius: 8px; color: white; font-weight: bold; font-size: 18px; margin-bottom: 20px; }
        .safe { background: #27ae60; }
        .unsafe { background: #c0392b; }

        .details-alert { background: #fff3cd; color: #856404; padding: 10px; border-radius: 5px; margin-bottom: 15px; border: 1px solid #ffeeba; font-size: 14px; }

        .logs-console { background: #2d3436; color: #00ff00; padding: 15px; border-radius: 6px; font-family: monospace; font-size: 12px; max-height: 150px; overflow-y: auto; margin-bottom: 20px; }
        .transcription-box { background: #f8f9fa; padding: 15px; border-radius: 6px; font-size: 14px; white-space: pre-wrap; max-height: 250px; overflow-y: auto; border: 1px solid #ddd;}

        .highlight-bad { background-color: #ffcccc; color: #cc0000; font-weight: bold; border-bottom: 2px solid #cc0000; padding: 0 2px; border-radius: 3px; }

        .history-section { margin-top: 40px; border-top: 4px solid #eee; padding-top: 20px; }
        .history-list { list-style: none; padding: 0; }
        .history-item { 
            background: white; border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; 
            border-radius: 6px; display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .history-item:hover { transform: translateY(-2px); border-color: #3498db; }
        .history-info { display: flex; flex-direction: column; gap: 5px; }
        .history-meta { font-size: 12px; color: #7f8c8d; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 30px; border-radius: 10px; width: 800px; max-height: 90vh; overflow-y: auto; position: relative; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: #999; }

        /* Overlay de Desligamento */
        #shutdownOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 2000; display: none;
            color: white; flex-direction: column; justify-content: center; align-items: center;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="shutdownOverlay">
    <h1 style="color:white">🛑 SERVIDOR DESLIGADO</h1>
    <p>A aplicação foi encerrada. Para usar novamente, reinicie o servidor no terminal.</p>
</div>

<div class="container">
    <button class="shutdown-btn" onclick="desligarServidor()" title="Desligar Servidor"></button>

    <h1>🎛️ IA Musical Pro</h1>
    <p style="text-align:center; color:#7f8c8d;">Detector de Ofensas Inteligente</p>

    <div class="main-grid">
        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
            <span style="font-size: 24px;">📂</span>
            <span id="fileName">Selecione o áudio (.mp3 / .wav)</span>
            <input type="file" id="fileInput" accept="audio/*" style="display:none" onchange="mostrarNome()">
        </div>

        <div class="config-box">
            <label><strong>1. Modelo de Transcrição:</strong></label>
            <select id="modelSelect">
                <option value="tiny">Tiny (Rápido)</option>
                <option value="base">Base (Normal)</option>
                <option value="small">Small (Bom)</option>
                <option value="medium" selected>Medium (Preciso)</option>
                <option value="large">Large (Máximo)</option>
            </select>
        </div>

        <div class="config-box">
            <label><strong>2. Palavras Proibidas (Opcional):</strong></label>
            <input type="text" id="badWordsInput" placeholder="Ex: idiota, feio, droga (separar por vírgula)">
            
            <label style="margin-top:10px;"><strong>3. Estratégia de Análise BERT:</strong></label>
            <div class="radio-group">
                <label><input type="radio" name="strategy" value="completa" checked> Completa (Média)</label>
                <label><input type="radio" name="strategy" value="segmentada"> Segmentada (Frases)</label>
            </div>
        </div>
    </div>

    <div class="action-buttons">
        <button id="btnProcessar" onclick="enviarAudio()">INICIAR ANÁLISE</button>
        <button id="btnCancelar" onclick="cancelarRequisicao()">CANCELAR</button>
    </div>

    <div id="timerDisplay" class="timer-display">⏱️ 0.0s</div>

    <div id="resultado" class="resultado-box">
        <h3>📊 Resultado da Análise</h3>
        <div id="conteudoResultado"></div>
    </div>

    <div class="history-section">
        <h3>🕒 Histórico Local</h3>
        <button onclick="limparHistorico()" style="width: auto; padding: 5px 10px; font-size: 12px; background:#e74c3c;">Limpar</button>
        <ul id="historyList" class="history-list"></ul>
    </div>
</div>

<div id="historyModal" class="modal-overlay" onclick="fecharModal(event)">
    <div class="modal-content">
        <span class="close-btn" onclick="fecharModal(true)">&times;</span>
        <h2 id="modalTitle">Detalhes</h2>
        <div id="modalBody"></div>
    </div>
</div>

<script>
    let timerInterval, startTime;
    let abortController = null;

    document.addEventListener("DOMContentLoaded", carregarHistorico);

    // --- FUNÇÃO DE DESLIGAR O SERVIDOR ---
    async function desligarServidor() {
        if(!confirm("⚠️ Tem certeza que deseja desligar o servidor?\nO site vai parar de funcionar até você rodar o comando novamente no terminal.")) return;

        try {
            await fetch("/shutdown", { method: "POST" });
            // Mostra o overlay preto
            document.getElementById("shutdownOverlay").style.display = "flex";
        } catch (e) {
            alert("Erro ao tentar desligar: " + e);
        }
    }

    function mostrarNome() {
        const file = document.getElementById('fileInput').files[0];
        if(file) document.getElementById('fileName').innerText = file.name;
    }

    function startTimer() {
        document.getElementById('timerDisplay').style.display = 'block';
        startTime = Date.now();
        timerInterval = setInterval(() => {
            document.getElementById('timerDisplay').innerText = `⏱️ ${((Date.now() - startTime) / 1000).toFixed(1)}s`;
        }, 100);
    }
    
    function stopTimer() { clearInterval(timerInterval); }

    function cancelarRequisicao() {
        if (abortController) {
            abortController.abort();
            abortController = null;
            stopTimer();
            resetUI("Cancelado pelo usuário.");
        }
    }

    function resetUI(msgOpcional) {
        document.getElementById('btnProcessar').disabled = false;
        document.getElementById('btnProcessar').innerText = "INICIAR ANÁLISE";
        document.getElementById('btnCancelar').style.display = "none";
        if (msgOpcional) alert(msgOpcional);
    }

    async function enviarAudio() {
        const fileInput = document.getElementById('fileInput');
        const badWords = document.getElementById('badWordsInput').value;
        const strategy = document.querySelector('input[name="strategy"]:checked').value;
        const model = document.getElementById('modelSelect').value;
        const btn = document.getElementById('btnProcessar');
        const btnCancel = document.getElementById('btnCancelar');
        
        if (!fileInput.files[0]) { alert("Selecione um arquivo!"); return; }
        
        const nomeArquivoSeguro = fileInput.files[0].name;

        document.getElementById('resultado').style.display = 'none';
        btn.disabled = true; 
        btn.innerText = "PROCESSANDO...";
        btnCancel.style.display = "block";
        
        startTimer();
        abortController = new AbortController();

        const formData = new FormData();
        formData.append("arquivo", fileInput.files[0]);
        formData.append("modelo", model);
        formData.append("palavras_proibidas", badWords);
        formData.append("estrategia", strategy);

        try {
            const response = await fetch("/analisar", { 
                method: "POST", 
                body: formData,
                signal: abortController.signal 
            });

            const textData = await response.text();
            let data;
            try { data = JSON.parse(textData); } catch (e) { throw new Error("Resposta inválida: " + textData.substring(0, 100)); }
            
            stopTimer(); 
            resetUI();

            if (!data.sucesso) {
                renderizarHtmlNoDiv("conteudoResultado", `<div style="color:red; background:#fee; padding:10px;">Erro: ${data.erro}</div>`);
            } else {
                const html = gerarHtmlResultado(data);
                renderizarHtmlNoDiv("conteudoResultado", html);
                salvarNoHistorico({
                    dataHora: new Date().toLocaleString(),
                    arquivo: nomeArquivoSeguro,
                    modelo: model,
                    resultado: data
                });
            }
            document.getElementById('resultado').style.display = 'block';

        } catch (error) {
            if (error.name === 'AbortError') {
                console.log("Requisição cancelada.");
            } else {
                stopTimer();
                resetUI();
                alert("Erro: " + error);
            }
        }
    }

    function aplicarDestaque(texto, palavrasProibidas) {
        if (!palavrasProibidas || palavrasProibidas.length === 0) return texto;
        let textoDestacado = texto;
        palavrasProibidas.forEach(palavra => {
            const regex = new RegExp(`(${palavra})`, 'gi');
            textoDestacado = textoDestacado.replace(regex, '<span class="highlight-bad">$1</span>');
        });
        return textoDestacado;
    }

    function gerarHtmlResultado(data) {
        const a = data.analise;
        const veredito = a.eh_ofensivo ? "🚫 CONTEÚDO OFENSIVO" : "✅ CONTEÚDO SEGURO";
        const vereditoClass = a.eh_ofensivo ? "unsafe" : "safe";
        
        const transcricaoComDestaque = aplicarDestaque(data.transcricao, a.motivo_palavras);

        let motivosHtml = "";
        if (a.motivo_palavras && a.motivo_palavras.length > 0) motivosHtml += `<div>🛑 <strong>Palavras Proibidas:</strong> ${a.motivo_palavras.join(", ")}</div>`;
        if (a.frases_criticas && a.frases_criticas.length > 0) motivosHtml += `<div>⚠️ <strong>Frases Tóxicas:</strong> <ul>${a.frases_criticas.map(f => `<li>"${f}"</li>`).join('')}</ul></div>`;
        if (!motivosHtml && a.eh_ofensivo) motivosHtml = `<div>📉 <strong>Média Global Alta:</strong> Tom predominantemente negativo.</div>`;

        return `
            <div class="veredito-card ${vereditoClass}">${veredito}</div>
            ${motivosHtml ? `<div class="details-alert">${motivosHtml}</div>` : ''}
            <div class="metrics-grid">
                <div class="metric-card"><span class="metric-value">${data.metricas.tempo_transcricao}</span><span class="metric-label">Transcrição</span></div>
                <div class="metric-card"><span class="metric-value">${data.metricas.tempo_analise}</span><span class="metric-label">Análise</span></div>
                <div class="metric-card"><span class="metric-value">${data.metricas.tempo_total}</span><span class="metric-label">Total</span></div>
                <div class="metric-card"><span class="metric-value">${a.nivel_toxidade}%</span><span class="metric-label">Toxidade</span></div>
            </div>
            <label>🖥️ Logs:</label><div class="logs-console">${(data.logs || []).join('<br>> ')}</div>
            <label>📝 Transcrição:</label><div class="transcription-box">${transcricaoComDestaque}</div>
        `;
    }

    function renderizarHtmlNoDiv(id, html) { document.getElementById(id).innerHTML = html; }

    function salvarNoHistorico(item) {
        let h = JSON.parse(localStorage.getItem('iaHistory') || '[]');
        h.unshift(item); if(h.length > 10) h.pop();
        localStorage.setItem('iaHistory', JSON.stringify(h));
        carregarHistorico();
    }

    function carregarHistorico() {
        const h = JSON.parse(localStorage.getItem('iaHistory') || '[]');
        const list = document.getElementById('historyList');
        list.innerHTML = h.length ? '' : '<div style="color:#999; text-align:center">Vazio</div>';
        
        h.forEach(item => {
            const ehOfensivo = item.resultado.analise.eh_ofensivo;
            const badgeColor = ehOfensivo ? '#e74c3c' : '#27ae60';
            const badgeText = ehOfensivo ? 'Ofensivo' : 'Seguro';
            
            const li = document.createElement('li');
            li.className = 'history-item';
            
            li.innerHTML = `
                <div class="history-info">
                    <strong>🎵 ${item.arquivo}</strong>
                    <span class="history-meta">📅 ${item.dataHora} | 🧠 Modelo: ${item.modelo}</span>
                </div>
                <div style="text-align:right">
                    <span class="history-badge" style="background:${badgeColor}; color:white; padding:4px 8px; border-radius:4px; font-weight:bold; font-size:12px;">${badgeText}</span>
                    <br><small style="color:#999">Tempo: ${item.resultado.metricas.tempo_total}</small>
                </div>
            `;
            
            li.onclick = () => {
                document.getElementById('modalBody').innerHTML = gerarHtmlResultado(item.resultado);
                document.getElementById('historyModal').style.display = 'flex';
            };
            list.appendChild(li);
        });
    }

    function limparHistorico() { localStorage.removeItem('iaHistory'); carregarHistorico(); }
    function fecharModal(e) { if(e===true || e.target.id === 'historyModal') document.getElementById('historyModal').style.display = 'none'; }
</script>

</body>
</html>
